<!-- app-shell.component.html -->
<div class="min-h-screen bg-slate-50 text-[#373831]">
  <div class="lg:flex">
    <app-menu (collapsedChange)="onMenuCollapsedChange($event)"></app-menu>

    <div
      data-testid="shell-content"
      class="flex min-h-screen flex-1 flex-col transition-all duration-300"
      [class.lg:ml-72]="!isMenuCollapsed"
      [class.lg:ml-20]="isMenuCollapsed"
    >
      <header
        class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur sm:px-6 lg:flex lg:h-16 lg:items-stretch lg:bg-white lg:px-8 lg:py-0"
      >
        <app-header
          class="block min-h-0 min-w-0 w-full flex-1"
          [layout]="headerLayout()"
          [pageTitle]="headerPageTitle()"
          [userName]="headerUserName()"
          [quietNotificationButton]="quietNotificationBell()"
          backLink="/home"
          profileLink="/profile"
        />
      </header>

      <main
        id="conteudo"
        class="flex-1 px-4 py-4 pb-24 sm:px-6 lg:px-8 lg:pb-6"
      >
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
