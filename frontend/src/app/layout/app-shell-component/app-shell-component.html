<div class="min-h-screen bg-slate-50 text-[#373831]">
  <div class="lg:flex">
    <app-menu (menuCollapsedChange)="onMenuCollapsedChange($event)"></app-menu>
    <div
      data-testid="shell-content"
      class="flex min-h-screen flex-1 flex-col transition-all duration-300"
      [ngClass]="isMenuCollapsed ? 'lg:ml-20' : 'lg:ml-72'"
    >
    <header
        class="shell-px sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur lg:flex lg:h-16 lg:items-stretch lg:bg-white lg:py-0"
      >
        <app-header
          class="block min-h-0 min-w-0 w-full flex-1"
          [layout]="headerLayout()"
          [pageTitle]="headerPageTitle()"
          [quietNotificationButton]="quietNotificationBell()"
          backLink="/home"
          profileLink="/profile"
        />
      </header>
      <main
        id="conteudo"
        class="flex-1 py-4 pb-24 lg:pb-6"
        [class.shell-px-home]="onHome()"
        [class.shell-px]="!onHome()"
      >
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
