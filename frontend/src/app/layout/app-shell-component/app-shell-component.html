<!-- app-shell.component.html -->
<div class="min-h-screen bg-slate-50 text-[#373831]">
  <div class="lg:flex">
    <app-menu (collapsedChange)="onMenuCollapsedChange($event)"></app-menu>

    <div
      data-testid="shell-content"
      class="flex min-h-screen flex-1 flex-col transition-all duration-300"
      [class.lg:ml-72]="!isMenuCollapsed"
      [class.lg:ml-20]="isMenuCollapsed"
    >
      <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
        <div class="flex justify-end h-16 items-center px-4 sm:px-6">
          <h1 class="text-base font-semibold">Nome do usúario + Foto de perfil</h1>
        </div>
      </header>

      <main
        id="conteudo"
        class="flex-1 px-4 py-6 pb-24 sm:px-6 lg:px-8 lg:pb-6"
      >
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
