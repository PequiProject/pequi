<div
  *ngIf="form"
  [formGroup]="form"
  class="space-y-6"
  data-testid="details-step"
>
  <div>
    <h3
      class="text-[2rem] font-semibold leading-tight text-[#373831]"
      data-testid="details-title"
    >
      Quer adicionar mais detalhes?
    </h3>

    <p
      class="mt-2 max-w-2xl text-base leading-8 text-[#6B6B67]"
      data-testid="details-description"
    >
      Descreva onde você está notando mudanças ou detalhe os seus principais sintomas de hoje. Cada detalhe ajuda.
    </p>
  </div>

  <div
    class="rounded-2xl border border-[#ECE7E2] bg-white p-4 shadow-sm"
    data-testid="details-textarea-block"
  >
    <label
      for="notes"
      class="mb-2 block text-sm font-medium text-[#373831]"
      data-testid="details-textarea-label"
    >
      Observações adicionais (opcional)
    </label>

    <textarea
      id="notes"
      formControlName="notes"
      rows="6"
      placeholder="Ex.: senti mais desconforto no período da manhã, após caminhar. A pele seca está piorando, mas a fraqueza está menor que ontem."
      data-testid="details-textarea"
      class="min-h-36 w-full rounded-xl border border-[#D9D4CE] px-4 py-3 text-sm text-[#373831] outline-none transition placeholder:text-[#9A968F] focus:border-[#436D57]"
    ></textarea>
  </div>

  <div class="rounded-2xl border border-[#ECE7E2] bg-white p-4 shadow-sm">
    <div class="flex justify-between items-center mb-3">
      <label class="block text-sm font-medium text-[#373831]">
        Registros fotográficos (opcional)
      </label>
      <span class="text-xs font-semibold text-[#9A968F] bg-[#F2F1ED] px-2 py-1 rounded-md">
        {{ images().length }} adicionada(s)
      </span>
    </div>

    <input
      type="file"
      id="checkin-image-upload"
      class="hidden"
      accept="image/*"
      multiple
      (change)="onFilesSelected($event)"
    >

    <button
      type="button"
      (click)="triggerFileInput()"
      class="flex w-full flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-[#D9D4CE] bg-[#F8F9FA] px-4 py-8 text-sm font-medium text-[#6B6B67] transition hover:bg-[#F2F1ED] hover:border-[#436D57] hover:text-[#436D57]"
    >
      <lucide-icon [name]="ImagePlusIcon" [size]="28" class="text-[#9A968F]"></lucide-icon>
      <div class="text-center">
        <span class="block text-[#373831] font-semibold">Toque para adicionar fotos</span>
        <span class="text-xs text-[#9A968F] font-normal mt-1">Você pode selecionar várias de uma vez</span>
      </div>
    </button>

    @if (images().length > 0) {
      <div class="mt-4 grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        @for (img of images(); track $index) {
          <div class="relative group aspect-square rounded-xl overflow-hidden border border-[#ECE7E2] shadow-sm">
            <img [src]="img.previewUrl" class="w-full h-full object-cover" alt="Preview do registro fotográfico">

            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <button
                type="button"
                (click)="removeImage($index)"
                class="bg-white p-2 rounded-full text-red-600 hover:bg-red-50 hover:scale-110 transition-transform shadow-md"
                title="Remover imagem"
              >
                <lucide-icon [name]="TrashIcon" [size]="18"></lucide-icon>
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
