<div
  class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4 sm:top-6"
  aria-live="polite"
  aria-relevant="additions"
  data-testid="toast-container"
>
  @for (item of toastService.items(); track item.id) {
    <app-toast
      class="pointer-events-auto w-full max-w-md starting:-translate-y-2 starting:opacity-0 transition-all duration-200 ease-out"
      [variant]="item.variant"
      [title]="item.title"
      [description]="item.description ?? null"
      (dismissed)="toastService.dismiss(item.id)"
    />
  }
</div>
