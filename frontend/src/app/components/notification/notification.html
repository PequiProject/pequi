<section class="mx-auto max-w-xl" aria-labelledby="notifications-heading">
  <h1
    id="notifications-heading"
    class="m-0 pb-5 text-[1.375rem] font-bold text-[var(--title-color)]"
  >
    Notificações
  </h1>

  <ul class="m-0 list-none space-y-3 p-0" role="list">
    <li>
      <app-notification-card
        [unread]="true"
        title="Lembrete de check-in"
        timeLabel="Hoje, 09:30"
        timeDatetime="2026-05-14T09:30"
        body="Que tal registrar como você está se sentindo hoje? Leva menos de um minuto."
      />
    </li>
    <li>
      <app-notification-card
        [unread]="false"
        title="Dica da semana"
        timeLabel="Seg., 14:00"
        timeDatetime="2026-05-12T14:00"
        body="Hidratação e repouso ajudam na recuperação. Veja o artigo na aba Educação."
      />
    </li>
  </ul>
</section>
