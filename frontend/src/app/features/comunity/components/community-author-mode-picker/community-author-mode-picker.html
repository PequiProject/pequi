<div
  class="flex items-center justify-between gap-3"
  data-testid="author-mode-picker"
  role="group"
  aria-label="Publicando como"
>
  <span class="text-sm font-semibold text-[#373831]">Publicando como</span>
  <div class="inline-flex shrink-0 rounded-full bg-[#F5F5F4] p-1">
    @for (option of options; track option.mode) {
      <button
        type="button"
        [attr.data-mode]="option.mode"
        [attr.aria-pressed]="isSelected(option.mode)"
        (click)="select(option.mode)"
        class="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4338CA] sm:px-3.5 sm:text-sm"
        [ngClass]="
          isSelected(option.mode)
            ? 'bg-white text-[#4338CA] shadow-sm'
            : 'text-[#64655C] hover:text-[#373831]'
        "
      >
        <lucide-icon [name]="option.icon" [size]="14" [strokeWidth]="2" aria-hidden="true" />
        {{ option.label }}
      </button>
    }
  </div>
</div>
