<div
  [class]="containerClass()"
  [attr.data-testid]="anonymous() ? 'anonymous-avatar' : 'public-avatar'"
  aria-hidden="true"
>
  @if (anonymous()) {
    <lucide-icon
      [name]="LucideVenetianMask"
      [size]="iconSize()"
      [strokeWidth]="2"
      aria-hidden="true"
    />
  } @else if (imageUrl()) {
    <img
      [src]="imageUrl()!"
      alt=""
      class="h-full w-full object-cover"
      data-testid="author-avatar-image"
    />
  } @else {
    {{ initials() }}
  }
</div>
