<article
  class="cursor-pointer rounded-2xl bg-white p-4 shadow-sm ring-1 ring-[#E7E5E4] transition hover:ring-[#D6D3D1] sm:p-5"
  tabindex="0"
  [attr.data-testid]="'post-card-' + post().id"
  [attr.aria-label]="'Post de ' + post().authorName + '. Toque para ver comentários.'"
  (click)="onOpenPost()"
  (keydown.enter)="onOpenPost(); $event.preventDefault()"
  (keydown.space)="onOpenPost(); $event.preventDefault()"
>
  <header class="mb-3 flex items-start justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3">
      <app-community-author-avatar
        [initials]="post().authorInitials"
        [anonymous]="post().isAnonymous ?? false"
      />
      <div class="min-w-0">
        <p class="truncate font-semibold text-[#373831]">{{ post().authorName }}</p>
        <p class="text-xs text-[#64655C]">{{ post().timeLabel }}</p>
      </div>
    </div>
    <div class="flex shrink-0 flex-wrap items-center justify-end gap-1.5">
      @for (label of post().categoryLabels; track label) {
        <span
          class="rounded-full bg-[#CAF9DC] px-2.5 py-1 text-xs font-medium text-[#64655C]"
        >
          {{ label }}
        </span>
      }
      @if (post().isOwn) {
        <button
          type="button"
          data-testid="delete-post-btn"
          (click)="onDelete($event)"
          class="rounded-full p-1 text-[#B91C1C] transition hover:bg-[#FEE2E2] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#B91C1C]"
          aria-label="Excluir post"
        >
          <lucide-icon [name]="LucideTrash2" [size]="18" [strokeWidth]="2" />
        </button>
      }
    </div>
  </header>

  <h3 class="mb-2 text-base font-bold text-[#373831] sm:text-lg">{{ post().title }}</h3>

  <p class="mb-4 text-sm leading-relaxed text-[#64655C] sm:text-base">
    {{ post().description }}
  </p>

  <footer class="flex flex-wrap items-center gap-3 border-t border-[#F5F5F4] pt-3">
    <button
      type="button"
      data-testid="support-btn"
      (click)="onSupport($event)"
      class="inline-flex cursor-pointer items-center gap-1.5 rounded-full px-2 py-1.5 text-sm font-medium transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4338CA]"
      [ngClass]="post().isSupported ? 'text-[#4338CA]' : 'text-[#64655C]'"
      [attr.aria-pressed]="post().isSupported"
      [attr.aria-label]="'Apoiar, ' + post().supportCount + ' apoios'"
    >
      <span
        class="inline-flex shrink-0"
        [class.heart-filled]="post().isSupported"
        [class.text-[#4338CA]]="post().isSupported"
        aria-hidden="true"
      >
        <lucide-icon [name]="LucideHeart" [size]="18" [strokeWidth]="2" />
      </span>
      <span data-testid="support-count">{{ post().supportCount }}</span>
      <span class="sr-only">apoios</span>
    </button>
    <span
      class="inline-flex items-center gap-1.5 text-sm font-medium text-[#64655C]"
      data-testid="comment-count"
      [attr.aria-label]="commentCountLabel()"
    >
      <lucide-icon [name]="LucideMessageSquare" [size]="18" [strokeWidth]="2" aria-hidden="true" />
      <span>{{ post().commentCount }}</span>
      <span class="sr-only">comentários</span>
    </span>
  </footer>
</article>
