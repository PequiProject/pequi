<section class="mx-auto w-full max-w-5xl">
    <div>
    <h2 class="text-2xl font-semibold text-[#373831]">Medicação</h2>
        <p class="mt-1 text-sm text-[#373831]">
            Registre as medicações que você já tomou hoje
        </p>
    </div>

  <div class="medication-list" *ngIf="medications.length">
    <article
      class="medication-item"
      *ngFor="let item of medications; trackBy: trackById"
      [class.medication-item--checked]="item.checked"
    >
      <div class="medication-item__left">
        <div class="medication-item__icon-wrapper">
          <div
            class="medication-item__icon"
            [class.medication-item__icon--checked]="item.checked"
          >
            <span *ngIf="item.checked">✓</span>
            <span *ngIf="!item.checked">💊</span>
          </div>
        </div>

        <div class="medication-item__content">
          <strong class="medication-item__name">{{ item.name }}</strong>

          <span class="medication-item__meta">
            {{ item.dosageValue }}
            {{ item.dosageUnit === 'unit' ? 'Unidade' : item.dosageUnit }}
            <ng-container *ngIf="item.time">
              • {{ item.time }}
            </ng-container>
          </span>
        </div>
      </div>

      <div class="medication-item__right">
        <ng-container *ngIf="item.checked; else toggleTemplate">
          <span class="medication-item__badge">Feito</span>
        </ng-container>

        <ng-template #toggleTemplate>
          <label class="switch" aria-label="Marcar medicamento como tomado">
            <input
              type="checkbox"
              [checked]="!!item.checked"
              (change)="toggleChecked(item.id)"
            />
            <span class="switch__slider"></span>
          </label>
        </ng-template>
      </div>
    </article>
  </div>


    <div class="medication-empty flex justify-center align-middle p-8 font-medium text-sm" *ngIf="medications.length === 0">
      <p>Nenhum medicamento cadastrado.</p>
    </div>

</section>
