<div
  class="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1 pt-5 scrollbar-none"
  role="tablist"
  aria-label="Filtrar conteúdos educativos"
  data-testid="education-filter-tags"
>
  @for (tag of tags(); track tag.id) {
    <button
      type="button"
      role="tab"
      [attr.data-filter]="tag.id"
      [attr.aria-selected]="isActive(tag.id)"
      (click)="selectTag(tag.id)"
      class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4338CA] sm:px-5 sm:py-2.5"
      [ngClass]="
        isActive(tag.id)
          ? 'bg-[#CAF9DC] text-[#436D57]'
          : 'bg-[#F5F5F4] text-[#64655C] hover:bg-[#E7E5E4]'
      "
    >
      {{ tag.label }}
    </button>
  }
</div>
