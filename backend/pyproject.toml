[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pequi"
version = "0.0.1"
description = "Backend do Projeto Pequi — acompanhamento de hanseníase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.2.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "arq>=0.26.1",
    "aiobotocore>=2.15.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "factory-boy>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pequi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "ARG001", # unused function argument (common in FastAPI route handlers)
]

[tool.ruff.lint.isort]
known-first-party = ["pequi"]
