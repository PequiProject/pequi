version: '3.8'

services:
  migrate:
    image: ${IMAGE_TAG}
    container_name: migrate_prod
    restart: "no"                          # era 'always' — corrigido
    env_file:
      - .env.prod
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prod_net

  api:
    image: ${IMAGE_TAG}
    container_name: api_prod
    restart: always
    # sem 'ports' — nginx acessa via rede interna; não expõe 8000 publicamente
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn pequi.main:app --host 0.0.0.0 --port 8000
    networks:
      - prod_net

  worker:
    image: ${IMAGE_TAG}
    container_name: worker_prod
    restart: always
    env_file:
      - .env.prod
    command: python -m arq pequi.workers.settings.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_net

  db:
    image: postgis/postgis:16-3.4
    container_name: db_prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prod_net

  redis:
    image: redis:7-alpine
    container_name: redis_prod
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - prod_net

  minio:
    image: minio/minio
    container_name: minio_prod
    restart: always
    env_file:
      - .env.prod
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"   # 9010 no host para não conflitar com staging (9000)
      - "9011:9001"   # 9011 no host para não conflitar com staging (9002)
    volumes:
      - miniodata_prod:/data
    networks:
      - prod_net

  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - prod_net

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:

networks:
  prod_net:
    name: prod_net
