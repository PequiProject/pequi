services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pequi:pequi@db:5432/pequi
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET_IMAGES: pequi-images
      STORAGE_REGION: us-east-1
      SECRET_KEY: dev-secret-key-change-in-production
      ENV: development
      SENTRY_DSN: ""
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn pequi.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    command: python -m arq pequi.workers.settings.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://pequi:pequi@db:5432/pequi
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET_IMAGES: pequi-images
      STORAGE_REGION: us-east-1
      SECRET_KEY: dev-secret-key-change-in-production
      ENV: development
      SENTRY_DSN: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pequi
      POSTGRES_PASSWORD: pequi
      POSTGRES_DB: pequi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pequi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
